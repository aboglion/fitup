<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitUp Pro — קטלוג כל תרגילי התוכנית ומדריך ביומכני מלא</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 26, 43, 0.90);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(56, 189, 248, 0.45);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.22);
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.20);
      --accent-amber: #f59e0b;
      --accent-indigo: #6366f1;
      --header-bg: rgba(9, 13, 22, 0.94);
      --radius: 16px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Rubik', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      padding-bottom: 80px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 24px;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      padding: 7px 15px;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
      letter-spacing: 0.5px;
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stats-pill {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      font-size: 0.85rem;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-val {
      font-weight: 700;
      color: var(--primary);
    }

    .controls-bar {
      max-width: 1440px;
      margin: 20px auto 0;
      padding: 0 24px;
    }

    .top-controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px 20px;
    }

    .search-row {
      display: flex;
      gap: 12px;
    }

    .search-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 11px 18px;
      color: #fff;
      font-family: 'Rubik', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .tabs-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      color: var(--text-muted);
      font-family: 'Rubik', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(99, 102, 241, 0.22));
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    .tab-count {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.75rem;
    }

    main {
      max-width: 1440px;
      margin: 24px auto 0;
      padding: 0 24px;
    }

    .catalog-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 22px;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .card:hover {
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 32px rgba(56, 189, 248, 0.10);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .card-title-group {
      flex: 1;
      min-width: 260px;
    }

    .card-title-group h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .name-en {
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      color: var(--primary);
      font-weight: 500;
      margin-top: 3px;
    }

    .badge-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .badge-day {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .badge-week {
      background: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .badge-equip {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-category {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Side-by-Side Visuals Container */
    .visuals-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 820px) {
      .visuals-row {
        grid-template-columns: 1fr;
      }
    }

    .media-card {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }

    .media-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .media-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .media-header.static-hdr {
      color: #7dd3fc;
    }

    .media-header.gif-hdr {
      color: #6ee7b7;
    }

    .media-container {
      position: relative;
      height: 310px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #060911;
      cursor: zoom-in;
      overflow: hidden;
    }

    .media-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .media-container:hover img {
      transform: scale(1.03);
    }

    .media-zoom-hint {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.65);
      color: var(--text-muted);
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 4px;
      pointer-events: none;
    }

    /* Specs Grid */
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 16px;
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .spec-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .spec-value {
      font-size: 0.90rem;
      color: #e2e8f0;
      font-weight: 600;
    }

    /* Biomechanical Cues Box */
    .cues-box {
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.20);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .cues-icon {
      font-size: 1.25rem;
      line-height: 1;
      margin-top: 2px;
    }

    .cues-content strong {
      color: var(--primary);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 24px;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: var(--radius);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.25);
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 28px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      font-size: 1.8rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .lightbox-close:hover {
      background: rgba(244, 63, 94, 0.8);
      transform: scale(1.05);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="logo-badge">FITUP PRO</div>
        <div class="title-group">
          <h1>קטלוג תרגילי התוכנית ומדריך ביומכני מלא</h1>
          <p>תצוגה מקבילה: תמונה סטטית איורית + אנימציית GIF מונפשת, מועדי פתיחה ודגשי מניעת פציעות</p>
        </div>
      </div>
      <div class="stats-pill">
        <div class="stat-item">
          <span>סה״כ תרגילים:</span>
          <span class="stat-val" id="stat-total">80</span>
        </div>
        <div class="stat-item">
          <span>אימות קבצים:</span>
          <span class="stat-val" style="color: #10b981;">100% תקין (0 שגיאות)</span>
        </div>
      </div>
    </div>
  </header>

  <div class="controls-bar">
    <div class="top-controls">
      <div class="search-row">
        <input type="text" class="search-input" id="search-input" placeholder="חיפוש לפי שם תרגיל (עברית/אנגלית), שבוע פתיחה, יום או שריר מטרה..." oninput="handleSearch()">
      </div>
      <div class="tabs-nav">
        <button class="tab-btn active" onclick="filterTab('all', this)">
          כל התרגילים <span class="tab-count" id="count-all">80</span>
        </button>
        <button class="tab-btn" onclick="filterTab('day1', this)">
          יום 1 (רגליים וליבה) <span class="tab-count" id="count-day1">23</span>
        </button>
        <button class="tab-btn" onclick="filterTab('day2', this)">
          יום 2 (אירובי בסיס) <span class="tab-count" id="count-day2">2</span>
        </button>
        <button class="tab-btn" onclick="filterTab('day3', this)">
          יום 3 (דחיקה ועליון) <span class="tab-count" id="count-day3">31</span>
        </button>
        <button class="tab-btn" onclick="filterTab('day4', this)">
          יום 4 (התאוששות וצוואר) <span class="tab-count" id="count-day4">5</span>
        </button>
        <button class="tab-btn" onclick="filterTab('day5', this)">
          יום 5 (משיכה וידיים) <span class="tab-count" id="count-day5">18</span>
        </button>
        <button class="tab-btn" onclick="filterTab('day6', this)">
          יום 6 (אירובי עצים) <span class="tab-count" id="count-day6">1</span>
        </button>
      </div>
    </div>
  </div>

  <main>
    <div class="catalog-grid" id="exercises-container">
      <!-- Dynamic Exercise Cards rendered via JavaScript -->
    </div>
  </main>

    <button class="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="Full view" onclick="event.stopPropagation()">
  </div>

    let currentFilter = 'all';

    // Update tab count badges dynamically
    document.getElementById('count-all').textContent = EXERCISES.length;
    document.getElementById('count-day1').textContent = EXERCISES.filter(x => x.dayNum === 1).length;
    document.getElementById('count-day2').textContent = EXERCISES.filter(x => x.dayNum === 2).length;
    document.getElementById('count-day3').textContent = EXERCISES.filter(x => x.dayNum === 3).length;
    document.getElementById('count-day4').textContent = EXERCISES.filter(x => x.dayNum === 4).length;
    document.getElementById('count-day5').textContent = EXERCISES.filter(x => x.dayNum === 5).length;
    document.getElementById('count-day6').textContent = EXERCISES.filter(x => x.dayNum === 6).length;

    function filterTab(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    }

    function handleSearch() {
      renderCards();
    }

    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      lb.classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    function renderCards() {
      const container = document.getElementById('exercises-container');
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = EXERCISES.filter(ex => {
        // Tab filtering
        if (currentFilter === 'day1' && ex.dayNum !== 1) return false;
        if (currentFilter === 'day2' && ex.dayNum !== 2) return false;
        if (currentFilter === 'day3' && ex.dayNum !== 3) return false;
        if (currentFilter === 'day4' && ex.dayNum !== 4) return false;
        if (currentFilter === 'day5' && ex.dayNum !== 5) return false;
        if (currentFilter === 'day6' && ex.dayNum !== 6) return false;

        // Search query
        if (query) {
          const hay = (
            ex.nameEn + ' ' + 
            ex.nameHe + ' ' + 
            ex.category + ' ' + 
            ex.equipment + ' ' + 
            ex.unlockTiming + ' ' + 
            ex.dayName + ' ' + 
            ex.cues
          ).toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">לא נמצאו תרגילים התואמים לחיפוש שלך.</div>';
        return;
      }

      container.innerHTML = filtered.map(ex => {
        return `
          <div class="card" id="card-${ex.id}">
            <div class="card-header">
              <div class="card-title-group">
                <h2>${ex.nameHe}</h2>
                <div class="name-en">${ex.nameEn}</div>
              </div>
              <div class="badge-group">
                <span class="badge badge-day">📅 ${ex.dayName}</span>
                <span class="badge badge-category">🏷️ ${ex.category}</span>
                <span class="badge badge-equip">⚙️ ${ex.equipment}</span>
                <span class="badge badge-week">🔓 ${ex.unlockTiming}</span>
              </div>
            </div>

            <!-- Side-by-Side Visuals: Static Image AND Animated GIF -->
            <div class="visuals-row">
              <!-- Frame 1: Static Image -->
              <div class="media-card">
                <div class="media-header static-hdr">
                  <span>🖼️ תמונה מציגה (איור אנטומי)</span>
                  <span style="font-size: 0.72rem; opacity: 0.8;">תצוגה סטטית</span>
                </div>
                <div class="media-container" onclick="openLightbox('${ex.img}?v=20261023_v5')" title="לחץ להגדלה במסך מלא">
                  <img src="${ex.img}?v=20261023_v5" alt="${ex.nameEn} Static" loading="lazy">
                  <span class="media-zoom-hint">🔍 לחץ להגדלה</span>
                </div>
              </div>

              <!-- Frame 2: Animated GIF -->
              <div class="media-card">
                <div class="media-header gif-hdr">
                  <span>🎬 אנימציית תנועה (GIF מונפש)</span>
                  <span style="font-size: 0.72rem; opacity: 0.8;">לולאת תנועה</span>
                </div>
                <div class="media-container" onclick="openLightbox('${ex.gif}?v=20261023_v5')" title="לחץ להגדלה במסך מלא">
                  <img src="${ex.gif}?v=20261023_v5" alt="${ex.nameEn} GIF" loading="lazy">
                  <span class="media-zoom-hint">🔍 לחץ להגדלה</span>
                </div>
              </div>
            </div>

            <!-- Specifications Grid -->
            <div class="specs-grid">
              <div class="spec-item">
                <span class="spec-label">מועד ושלב פתיחה</span>
                <span class="spec-value">${ex.unlockTiming}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">תנאי פתיחה ודרישות קדם</span>
                <span class="spec-value">${ex.unlockPrereq}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">סטי עבודה ויעד חזרות/זמן</span>
                <span class="spec-value">${ex.setsReps}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">קצב תנועה (Tempo)</span>
                <span class="spec-value">${ex.tempo}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">זמן מנוחה בין סטים</span>
                <span class="spec-value">${ex.rest}</span>
              </div>
            </div>

            <!-- Biomechanical & Safety Cues -->
            <div class="cues-box">
              <span class="cues-icon">💡</span>
              <div class="cues-content">
                <strong>דגש ביומכני, שמירה על עמוד שדרה (L4-S1) ומניעת פציעות:</strong>
                ${ex.cues}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Initial render
    renderCards();
  </script>
