<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitUp Pro — קטלוג תרגילים מלא ודוח השוואת תיקונים ביומכניים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 26, 43, 0.88);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #38bdf8;
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.25);
      --accent-rose: #f43f5e;
      --accent-rose-glow: rgba(244, 63, 94, 0.25);
      --accent-amber: #f59e0b;
      --accent-indigo: #6366f1;
      --header-bg: rgba(9, 13, 22, 0.94);
      --radius: 16px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Rubik', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      padding-bottom: 80px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      background: var(--header-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 24px;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
    }

    .title-group h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .view-selector {
      display: flex;
      gap: 8px;
      background: rgba(11, 17, 30, 0.8);
      border: 1px solid var(--card-border);
      padding: 4px;
      border-radius: var(--radius-sm);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Rubik', sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view-btn.active {
      background: var(--primary);
      color: #041226;
    }

    .controls-bar {
      max-width: 1400px;
      margin: 24px auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 14px 20px;
      border-radius: var(--radius);
      backdrop-filter: blur(10px);
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(11, 17, 30, 0.7);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      color: #fff;
      font-family: 'Rubik', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      background: rgba(11, 17, 30, 0.8);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 4px;
      gap: 4px;
    }

    .toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Rubik', sans-serif;
    }

    .toggle-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 600;
    }

    .day-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .day-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Rubik', sans-serif;
    }

    .day-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .day-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.2));
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .comparison-grid {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: rgba(56, 189, 248, 0.3);
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    .card-title-group h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .card-title-group .name-en {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      color: var(--primary);
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 8px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-day {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .badge-week {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-status-ok {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .visual-comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 22px;
    }

    @media (max-width: 900px) {
      .visual-comparison {
        grid-template-columns: 1fr;
      }
    }

    .comparison-col {
      background: rgba(11, 17, 30, 0.6);
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .col-before {
      border-top: 4px solid var(--accent-rose);
    }

    .col-after {
      border-top: 4px solid var(--accent-green);
    }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .col-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .col-before .col-title { color: #fca5a5; }
    .col-after .col-title { color: #86efac; }

    .media-container {
      position: relative;
      background: #000;
      border-radius: var(--radius-sm);
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: zoom-in;
    }

    .media-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.2s;
    }

    .media-container:hover img {
      transform: scale(1.02);
    }

    .media-tag {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .col-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.02);
      padding: 10px 12px;
      border-radius: 8px;
      flex: 1;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      background: rgba(11, 17, 30, 0.4);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 16px;
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .spec-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .spec-value {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
    }

    .cues-box {
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.88rem;
      color: #bae6fd;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .cues-icon {
      font-size: 1.1rem;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .catalog-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
    }

    .catalog-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    .catalog-media {
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
    }

    .catalog-media img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .catalog-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .catalog-en {
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .catalog-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      margin-top: auto;
      border-top: 1px solid var(--card-border);
      padding-top: 10px;
    }

    .catalog-row {
      display: flex;
      justify-content: space-between;
    }

    .catalog-row .lbl {
      color: var(--text-dim);
    }

    .catalog-row .val {
      color: var(--text);
      font-weight: 500;
    }

    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 30px;
      backdrop-filter: blur(8px);
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: var(--radius-sm);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #fff;
      font-size: 2rem;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="logo-badge">FITUP PRO</div>
        <div class="title-group">
          <h1>דוח השוואת תרגילים ולוח זמני פתיחה (Biomechanical Perfection Audit)</h1>
          <p>השוואה חזותית מלאה: לפני (מה שהיה שגוי) מול אחרי (התיקון המדויק), מועדי פתיחה והנחיות ביומכניות</p>
        </div>
      </div>
      <div class="view-selector">
        <button class="view-btn active" id="btn-view-audit" onclick="setViewMode('audit')">
          🌟 השוואת תיקונים (לפני מול אחרי)
        </button>
        <button class="view-btn" id="btn-view-catalog" onclick="setViewMode('catalog')">
          📋 כל תרגילי התוכנית (41)
        </button>
      </div>
    </div>
  </header>

  <div class="controls-bar">
    <div class="top-controls">
      <div class="search-box">
        <input type="text" class="search-input" id="search-input" placeholder="חיפוש לפי שם תרגיל, שבוע, יום או מילת מפתח..." oninput="handleSearch()">
      </div>
      
      <div class="day-filters">
        <button class="day-btn active" onclick="filterDay('all', this)">הכל</button>
        <button class="day-btn" onclick="filterDay(1, this)">יום 1 (רגליים וליבה)</button>
        <button class="day-btn" onclick="filterDay(2, this)">יום 2 (Zone 2)</button>
        <button class="day-btn" onclick="filterDay(3, this)">יום 3 (דחיקה ועליון)</button>
        <button class="day-btn" onclick="filterDay(4, this)">יום 4 (צוואר והתאוששות)</button>
        <button class="day-btn" onclick="filterDay(5, this)">יום 5 (משיכה וידיים)</button>
        <button class="day-btn" onclick="filterDay(6, this)">יום 6 (VO2 Max)</button>
      </div>

      <div class="toggle-group" id="media-toggle-group">
        <button class="toggle-btn active" id="btn-show-gifs" onclick="setMediaType('gif')">אנימציות GIF</button>
        <button class="toggle-btn" id="btn-show-static" onclick="setMediaType('static')">תמונות סטטיות</button>
      </div>
    </div>
  </div>

  <main>
    <!-- View 1: Audit Comparison -->
    <div class="comparison-grid" id="audit-container"></div>

    <!-- View 2: Full Catalog -->
    <div class="catalog-grid" id="catalog-container" style="display: none;"></div>
  </main>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="Full view" onclick="event.stopPropagation()">
  </div>

    let currentView = 'audit';
    let currentMediaType = 'gif';
    let currentDayFilter = 'all';

    function setViewMode(mode) {
      currentView = mode;
      document.getElementById('btn-view-audit').classList.toggle('active', mode === 'audit');
      document.getElementById('btn-view-catalog').classList.toggle('active', mode === 'catalog');
      document.getElementById('audit-container').style.display = mode === 'audit' ? 'flex' : 'none';
      document.getElementById('catalog-container').style.display = mode === 'catalog' ? 'grid' : 'none';
      document.getElementById('media-toggle-group').style.display = mode === 'audit' ? 'flex' : 'none';
      renderView();
    }

    function setMediaType(type) {
      currentMediaType = type;
      document.getElementById('btn-show-gifs').classList.toggle('active', type === 'gif');
      document.getElementById('btn-show-static').classList.toggle('active', type === 'static');
      renderView();
    }

    function filterDay(day, btn) {
      currentDayFilter = day;
      document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderView();
    }

    function handleSearch() {
      renderView();
    }

    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      lb.classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function renderView() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      if (currentView === 'audit') {
        renderAudit(query);
      } else {
        renderCatalog(query);
      }
    }

    function renderAudit(query) {
      const container = document.getElementById('audit-container');
      const filtered = AUDITED.filter(ex => {
        if (currentDayFilter !== 'all' && ex.dayNum !== Number(currentDayFilter)) return false;
        if (query) {
          const hay = (ex.nameEn + ' ' + ex.nameHe + ' ' + ex.unlockTiming + ' ' + ex.category + ' ' + ex.day).toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 40px; font-size: 1.1rem;">לא נמצאו תרגילים מתאימים לסינון.</div>';
        return;
      }

      container.innerHTML = filtered.map(ex => {
        const beforeSrc = currentMediaType === 'gif' ? ex.beforeGif : ex.beforeImg;
        const afterSrc = currentMediaType === 'gif' ? ex.afterGif : ex.afterImg;

        return `
          <div class="card" data-id="${ex.id}">
            <div class="card-header">
              <div class="card-title-group">
                <h2>${ex.nameHe}</h2>
                <div class="name-en">${ex.nameEn}</div>
              </div>
              <div class="badge-group">
                <span class="badge badge-day">📅 ${ex.day}</span>
                <span class="badge badge-week">🔓 מתי נפתח: ${ex.unlockTiming}</span>
                <span class="badge badge-status-ok">✔ תוקן ואומת ביומכנית</span>
              </div>
            </div>

            <div class="visual-comparison">
              <!-- Before Column -->
              <div class="comparison-col col-before">
                <div class="col-header">
                  <div class="col-title">❌ התמונה / האנימציה שהייתה מקודם</div>
                  <span class="badge" style="background: rgba(244,63,94,0.15); color: #fca5a5;">לפני</span>
                </div>
                <div class="media-container" onclick="openLightbox('${beforeSrc}')">
                  <img src="${beforeSrc}" alt="${ex.nameEn} Before" loading="lazy" onerror="this.src='${ex.beforeImg}'">
                  <span class="media-tag">${currentMediaType === 'gif' ? 'GIF מונפש' : 'סטטי'} (הקודם)</span>
                </div>
                <div class="col-desc">
                  <strong>הליקוי הקודם:</strong> ${ex.beforeFlaw}
                </div>
              </div>

              <!-- After Column -->
              <div class="comparison-col col-after">
                <div class="col-header">
                  <div class="col-title">✅ התמונה / האנימציה המתוקנת כעת</div>
                  <span class="badge" style="background: rgba(16,185,129,0.15); color: #6ee7b7;">עכשיו באפליקציה</span>
                </div>
                <div class="media-container" onclick="openLightbox('${afterSrc}')">
                  <img src="${afterSrc}" alt="${ex.nameEn} After" loading="lazy" onerror="this.src='${ex.afterImg}'">
                  <span class="media-tag">${currentMediaType === 'gif' ? 'GIF מונפש' : 'סטטי'} (המתוקן)</span>
                </div>
                <div class="col-desc">
                  <strong>התיקון שהוטמע:</strong> ${ex.afterFix}
                </div>
              </div>
            </div>

            <div class="specs-grid">
              <div class="spec-item">
                <span class="spec-label">מועד ושלב פתיחה</span>
                <span class="spec-value">${ex.unlockTiming}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">תנאי פתיחה ודרישות קדם</span>
                <span class="spec-value">${ex.unlockPrereq}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">סטי עבודה וחזרות</span>
                <span class="spec-value">${ex.setsReps}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">קצב תנועה (Tempo)</span>
                <span class="spec-value">${ex.tempo}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">זמני מנוחה</span>
                <span class="spec-value">${ex.rest}</span>
              </div>
            </div>

            <div class="cues-box">
              <span class="cues-icon">💡</span>
              <div>
                <strong>דגש ביומכני ומניעת פציעות:</strong> ${ex.biomechanicalCues}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCatalog(query) {
      const container = document.getElementById('catalog-container');
      const filtered = CATALOG.filter(ex => {
        if (currentDayFilter !== 'all' && ex.dayNum !== Number(currentDayFilter)) return false;
        if (query) {
          const hay = (ex.nameEn + ' ' + ex.nameHe + ' ' + ex.unlock + ' ' + ex.day + ' ' + ex.cues).toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 40px; font-size: 1.1rem; grid-column: 1/-1;">לא נמצאו תרגילים מתאימים לסינון.</div>';
        return;
      }

      container.innerHTML = filtered.map(ex => `
        <div class="catalog-card">
          <div class="catalog-media" onclick="openLightbox('${ex.img}')">
            <img src="${ex.img}" alt="${ex.nameEn}" loading="lazy" onerror="this.style.opacity=0.3">
          </div>
          <div class="catalog-title">${ex.nameHe}</div>
          <div class="catalog-en">${ex.nameEn}</div>
          <div class="catalog-info">
            <div class="catalog-row">
              <span class="lbl">יום אימון:</span>
              <span class="val">${ex.day}</span>
            </div>
            <div class="catalog-row">
              <span class="lbl">מתי נפתח:</span>
              <span class="val" style="color: #fcd34d;">${ex.unlock}</span>
            </div>
            <div class="catalog-row">
              <span class="lbl">נפח עבודה:</span>
              <span class="val">${ex.setsReps}</span>
            </div>
            <div style="margin-top: 6px; font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">
              <strong>דגש:</strong> ${ex.cues}
            </div>
          </div>
        </div>
      `).join('');
    }

    // Initial render
    renderView();
  </script>
